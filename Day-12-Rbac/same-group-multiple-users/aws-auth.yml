apiVersion: v1
kind: ConfigMap
metadata:
  name: aws-auth
  namespace: kube-system
data:
  mapUsers: |
    - userarn: arn:aws:iam::694331062857:user/swathi
      username: swathi
      groups:
        - developer

    - userarn: arn:aws:iam::694331062857:user/user2
      username: user2
      groups:
        - developer

    - userarn: arn:aws:iam::694331062857:user/user3
      username: user3
      groups:
        - developer
